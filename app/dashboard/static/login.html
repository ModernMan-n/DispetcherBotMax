<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Дашборд диспетчерской</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="brand" style="padding:0">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="brand-name">Диспетчерская</div>
    </div>

    <form id="step-phone" novalidate>
      <h1>Вход</h1>
      <p class="lead">Введите номер телефона — бот пришлёт код в личные сообщения MAX.</p>
      <div class="form-error" id="phone-error" hidden></div>
      <label class="field">
        <span>Номер телефона</span>
        <input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 123-45-67" required>
      </label>
      <button class="btn primary" type="submit">Получить код</button>
      <p class="hint" style="margin-top:14px">Войти могут сотрудники, которых администратор добавил в список и которые один раз вошли в бота командой /staff.</p>
    </form>

    <form id="step-code" novalidate hidden>
      <h1>Код из MAX</h1>
      <p class="lead" id="code-lead"></p>
      <div class="form-error" id="code-error" hidden></div>
      <label class="field">
        <span>Код</span>
        <input class="input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
      </label>
      <button class="btn primary" type="submit">Войти</button>
      <p class="hint" style="margin-top:14px">
        <button class="link-btn" type="button" id="back">Другой номер</button>
        · код действует 5 минут
      </p>
    </form>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const detail = Array.isArray(data.detail) ? "Проверьте введённые данные" : data.detail;
    throw new Error(detail || `Ошибка ${res.status}`);
  }
  return data;
}

function showError(id, message) {
  const box = $(id);
  box.textContent = message;
  box.hidden = !message;
}

$("step-phone").addEventListener("submit", async e => {
  e.preventDefault();
  showError("phone-error", "");
  const btn = e.submitter; btn.disabled = true;
  try {
    const data = await post("/api/auth/request", { phone: $("phone").value });
    $("code-lead").textContent = data.message;
    $("step-phone").hidden = true;
    $("step-code").hidden = false;
    $("code").focus();
  } catch (err) {
    showError("phone-error", err.message);
  } finally {
    btn.disabled = false;
  }
});

$("step-code").addEventListener("submit", async e => {
  e.preventDefault();
  showError("code-error", "");
  const btn = e.submitter; btn.disabled = true;
  try {
    await post("/api/auth/verify", { phone: $("phone").value, code: $("code").value });
    location.replace("/");
  } catch (err) {
    showError("code-error", err.message);
    btn.disabled = false;
  }
});

$("back").addEventListener("click", () => {
  $("step-code").hidden = true;
  $("step-phone").hidden = false;
  $("code").value = "";
  $("phone").focus();
});
</script>
</body>
</html>
