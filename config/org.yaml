# Всё, что относится к конкретной организации. Для нового клиента копируется этот файл.
org_id: college-pilot
name: "Колледж (пилот)"

# Групповой чат диспетчерской в MAX, куда приходят новые заявки.
# ID задаётся в .env (DISPATCHER_CHAT_ID), чтобы не хранить его в репозитории.
# Узнать ID: добавить бота в чат администратором — он сам напишет ID в чат.
dispatcher_chat_id: null
timezone: Europe/Moscow

# Корпуса: code уходит в БД и в payload кнопок, title видит пользователь.
buildings:
  - code: "1"
    title: "Корпус 1"
  - code: "2"
    title: "Корпус 2"
  - code: "3"
    title: "Корпус 3"
  - code: "dorm"
    title: "Общежитие"

# Категории для автоопределения. Ключевые слова — начала слов (основы),
# сравнение без учёта регистра, «ё» = «е». sla_hours — норматив на выполнение,
# по нему считаются просроченные заявки.
# Категория с fallback: true выбирается, если ничего не подошло.
categories:
  - code: electric
    title: "Электрика"
    sla_hours: 8
    keywords: [свет, ламп, розетк, провод, электрич, искр, выключател, щиток, щитк, пробк, замыкан, светильник, удлинител]
  - code: network
    title: "Сеть и интернет"
    sla_hours: 4
    keywords: [интернет, сеть, сети, wi-fi, wifi, вайфай, вай-фай, роутер, маршрутизатор, свитч, коммутатор, сетев, локалк, патч-корд]
  - code: computers
    title: "Компьютерная техника"
    sla_hours: 24
    keywords: [компьютер, пк, ноутбук, монитор, принтер, мфу, картридж, проектор, мыш, клавиатур, системник, системный блок, интерактивн, колонк, экран, windows, виндовс, программ]
  - code: 1c
    title: "1С"
    sla_hours: 24
    keywords: [1с, 1c, зуп, бухгалтери, конфигурац, предприяти, документооборот]
  - code: furniture
    title: "Мебель"
    sla_hours: 72
    keywords: [стул, стуль, парт, стол, шкаф, доск, двер, замок, замк, ручк, полк, жалюзи, штор, карниз]
  - code: plumbing
    title: "Сантехника и отопление"
    sla_hours: 8
    keywords: [кран, вод, теч, протек, туалет, унитаз, раковин, слив, засор, канализац, батаре, отоплен, радиатор, холодно]
  - code: other
    title: "Прочее"
    sla_hours: 48
    keywords: []
    fallback: true

# Тексты бота. {name} и прочие плейсхолдеры подставляются в коде.
texts:
  welcome: |
    Здравствуйте! Это бот диспетчерской {org_name}.
    Здесь можно оставить заявку о технической проблеме: не работает свет, интернет, техника, сломалась мебель и т.п.
  privacy: |
    Для обработки заявки бот сохраняет ваше имя и идентификатор в MAX, чтобы диспетчер мог связаться с вами и сообщить о выполнении. Данные используются только для работы с заявками.
  ask_building: "Выберите корпус:"
  ask_room: "Укажите номер кабинета или помещения (например, 214 или «спортзал»):"
  bad_room: "Слишком длинно. Укажите только номер кабинета или короткое название помещения."
  ask_description: "Опишите проблему одним сообщением: что случилось и где именно."
  bad_description: "Опишите проблему чуть подробнее (хотя бы несколько слов)."
  confirm: |
    Проверьте заявку:
    Корпус: {building}
    Кабинет: {room}
    Проблема: {description}
    Категория: {category}
  created: "Заявка №{id} принята. Мы сообщим, когда её возьмут в работу."
  cancelled: "Заявка отменена."
  idle: "Чтобы оставить заявку, нажмите «Новая заявка»."
  no_requests: "У вас нет активных заявок."
  access_denied: |
    Бот доступен только сотрудникам колледжа.
    Если вы сотрудник, вступите в чат «Сотрудники» и через минуту попробуйте снова.
  # Уведомления заявителю при смене статуса
  notify_in_progress: "Ваша заявка №{id} взята в работу."
  notify_done: "Заявка №{id} выполнена. Если проблема осталась, оставьте новую заявку."
  notify_cancelled: "Заявка №{id} отменена диспетчерской."
